    <script>
      window.AN_BINH_TU_WS = window.AN_BINH_TU_WS || (location.hostname.includes('vercel.app') ? 'wss://an-binh-tu.onrender.com/ws' : '');

      // 1. Kiểm tra hỗ trợ WebGL đồ họa 3D trước khi nạp cảnh
      (function() {
        var supported = false;
        try {
          var c = document.createElement('canvas');
          supported = !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch(e) {
          supported = false;
        }
        window.__hasWebGL = supported;
      })();

      // 2. Cập nhật tiến trình tải trang nhẹ nhàng, KHÔNG BAO GIỜ tự tắt màn hình loading khi cảnh chưa sẵn sàng
      (function() {
        setTimeout(function() {
          var txt = document.querySelector('.loading-text');
          var l = document.getElementById('loading');
          if (txt && l && !l.classList.contains('done')) {
            txt.textContent = 'Đang nạp cảnh quan và tượng Phật 3D…'; var help = document.getElementById('loading-help'); if (help) help.style.display = 'flex';
          }
        }, 3500);

        setTimeout(function() {
          var txt = document.querySelector('.loading-text');
          var l = document.getElementById('loading');
          var help = document.getElementById('loading-help');
          if (l && !l.classList.contains('done')) {
            if (txt) txt.textContent = 'Đang kết nối không gian thanh tịnh…';
            if (help) help.style.display = 'flex';
          }
        }, 7000);

        setTimeout(function() {
          var txt = document.querySelector('.loading-text');
          var l = document.getElementById('loading');
          var help = document.getElementById('loading-help');
          if (l && !l.classList.contains('done')) {
            if (txt) txt.innerHTML = 'Mạng truyền tải dữ liệu 3D đang chậm.<br/><span style="font-size:12.5px; opacity:0.85;">Quý bạn có thể bấm nút dưới để thử tải lại hoặc đổi cổng:</span>';
            if (help) help.style.display = 'flex';
          }
        }, 13000);
      })();

      // 3. Bắt lỗi không mong muốn để không bao giờ để màn hình trống rỗng màu nâu
      window.addEventListener('error', function(e) {
        var l = document.getElementById('loading');
        if (l && !l.classList.contains('done')) {
          var txt = document.querySelector('.loading-text');
          var help = document.getElementById('loading-help');
          if (txt) {
            txt.innerHTML = '<span style="color:#ffd54f;">Đang thử nạp lại dữ liệu cảnh chùa…</span>';
          }
          if (help) help.style.display = 'flex';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var l = document.getElementById('loading');
        if (l && !l.classList.contains('done')) {
          var help = document.getElementById('loading-help');
          if (help) help.style.display = 'flex';
        }
      });

    <script>
      // a quiet line to read while the temple opens (our own words)
      var q = [
        'Đi chậm một chút, thở sâu một chút.',
        'Lòng lặng rồi, ở đâu cũng là chùa.',
        'Gieo một hạt lành, đợi một mùa an.',
        'Buông bớt một điều, nhẹ thêm một bước.',
        'Nụ cười hiền là nén hương thơm nhất.',
        'Lên chùa hôm nay, mang bình an về nhà.',
        'Mỗi tiếng chuông là một lần trở về.',
      ];
      document.querySelector('.loading-quote').textContent = '“' + q[Math.floor(Math.random() * q.length)] + '”';

      // 1. Click on zone-pill to view online peers
      document.addEventListener('click', function(e) {
        var zp = e.target.closest('.zone-pill');
        if (zp) {
          if (window.onlinePeersModal) {
            window.onlinePeersModal.open();
          }
        }
      });

      // 2. Click on 'Bạn đồng tu' in Menu to view online peers
      document.addEventListener('click', function(e) {
        var mb = e.target.closest('[data-menu="congdong"]');
        if (mb) {
          if (window.onlinePeersModal) {
            window.onlinePeersModal.open();
          }
        }
      });

      // 3. Clean up any orphaned friends-pill or merit-pill
      setInterval(function() {
        var pills = document.querySelectorAll('.friends-pill, .merit-pill');
        for (var i = 0; i < pills.length; i++) {
          pills[i].remove();
        }
      }, 500);

      
      // 5. Kiểm tra WebGL và hiển thị hướng dẫn nếu thiết bị/trình duyệt tắt WebGL
      if (!window.__hasWebGL) {
        var txt = document.querySelector('.loading-text');
        var help = document.getElementById('loading-help');
        var bar = document.querySelector('.loading-bar');
        var quote = document.querySelector('.loading-quote');
        if (quote) quote.style.display = 'none';
        if (bar) bar.style.display = 'none';
        if (txt) {
          txt.innerHTML = '<div style="color:#ffd54f;font-weight:600;font-size:15px;margin-bottom:8px;">⚠️ Trình duyệt chưa bật đồ họa 3D (WebGL)</div>' +
            '<div style="font-size:12.5px;line-height:1.55;max-width:340px;color:rgba(255,248,236,0.88);text-align:center;">' +
            'Để chiêm bái cảnh chùa 3D, quý bạn vui lòng khởi động lại trình duyệt Chrome (nếu vừa có thông báo cập nhật Chrome), hoặc bật <i>"Sử dụng tính năng tăng tốc đồ họa"</i> trong Cài đặt hệ thống của Chrome, hoặc mở bằng Edge / Safari.' +
            '</div>';
        }
        if (help) help.style.display = 'flex';
      }

      // 4. Clicking the wooden cylinder immediately draws lot
      document.addEventListener('click', function(e) {
        var cyl = e.target.closest('#lot-cylinder-wrap, .bamboo-cylinder, #lot-click-hint');
        if (cyl) {
          if (window.dailyLotModal && typeof window.dailyLotModal.shake === 'function') {
            window.dailyLotModal.shake();
          }
        }
      });
    </script>
